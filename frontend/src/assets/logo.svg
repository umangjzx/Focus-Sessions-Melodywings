<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <defs>
    <linearGradient id="infinityGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7EC8E3"/>
      <stop offset="50%" stop-color="#B8A9D4"/>
      <stop offset="100%" stop-color="#E8A87C"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8DCF0"/>
      <stop offset="100%" stop-color="#5BB5D6"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0C4A8"/>
      <stop offset="100%" stop-color="#E8A87C"/>
    </linearGradient>
  </defs>
  <!-- Infinity shape - left blue loop -->
  <path d="M100 60 C100 35, 75 20, 55 25 C35 30, 25 45, 30 60 C35 75, 50 85, 65 80 C80 75, 95 65, 100 60" 
        fill="url(#blueGrad)" opacity="0.9"/>
  <!-- Crescent cutout on left -->
  <path d="M55 40 C65 42, 70 52, 65 60 C60 68, 50 68, 45 62 C40 56, 42 45, 55 40Z" 
        fill="white"/>
  <!-- Infinity shape - right coral loop -->
  <path d="M100 60 C105 55, 120 45, 135 40 C150 35, 170 40, 172 55 C174 70, 160 82, 145 80 C130 78, 110 68, 100 60" 
        fill="url(#coralGrad)" opacity="0.9"/>
  <!-- Heart cutout on right -->
  <path d="M140 52 C143 48, 148 47, 152 50 C156 47, 161 48, 163 52 C166 58, 152 67, 152 67 C152 67, 138 58, 140 52Z" 
        fill="white"/>
  <!-- Connecting gradient stroke for depth -->
  <path d="M70 75 C85 68, 95 62, 100 60 C105 58, 115 52, 130 45" 
        stroke="url(#infinityGrad)" stroke-width="3" fill="none" opacity="0.5"/>
</svg>
